[package]
name = "fahis"
version = "1.0.0"
description = "See what your car is reporting on Windows with a Bluetooth LE ELM327 adapter."
authors = ["alequab"]
license-file = "../LICENSE"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
sys-locale = "0.3"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
